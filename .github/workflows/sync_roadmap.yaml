name: Assemble README with Dynamic Roadmap

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    paths:
      - '.readme/**'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v7

      - name: 🧭 Compute Velocity & Build English Roadmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_roadmap.py

      - name: 🧱 Assemble All Parts into README.md
        run: cat .readme/*.md > README.md

      - name: 🚀 Commit & Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .readme/02_roadmap.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-sync roadmap metrics and progress [skip ci]"
            git push origin HEAD:main
          fi