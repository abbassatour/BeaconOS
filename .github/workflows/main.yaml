# .github/workflows/main.yaml
name: beacon_os_ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Lint & Analyze Code
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Resolve Packages Dependencies
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ]; then
              echo "Resolving dependencies for $dir..."
              (cd "$dir" && flutter pub get)
            fi
          done
          echo "Resolving root dependencies..."
          flutter pub get

      - name: 🔍 Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔬 Analyze Code
        run: flutter analyze .

  build_android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Resolve All Dependencies
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && flutter pub get)
            fi
          done
          flutter pub get

      - name: 🚀 Build Development APK
        run: flutter build apk --flavor development -t lib/main_development.dart

      - name: 📤 Upload APK Artifact (For Judges & Testing)
        uses: actions/upload-artifact@v4
        with:
          name: BeaconOS-Development-APK
          path: build/app/outputs/flutter-apk/app-development-release.apk
          retention-days: 14